[project]
name = "vela"
version = "0.1.0"
description = "Vela Supervisor Agent Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.18",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.40",
    "langchain-google-genai>=1.0.2",
    "supabase>=2.4.0",
    "python-telegram-bot>=21.0.1",
    "discord.py>=2.3.2",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.122.0",
    "httpx>=0.27.0",
    "pygithub>=2.2.0",
    "sqlalchemy>=2.0.51",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.3",
    "langchain-cohere>=0.6.0",
    "langchain-voyageai>=0.4.0",
    "langchain-community>=0.4.2",
    "langchain-openrouter>=0.2.5",
    "langchain-tavily>=0.2.18",
    "duckduckgo-search>=8.1.1",
    "firebase-admin>=6.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=7.1.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "corpus: pinned transcript corpus replay (deterministic end-to-end fixtures)",
]

# Coverage (pytest-cov / coverage.py). The CI gate runs
# `pytest --cov=. --cov-fail-under=60` (see vela_ci.py BACKEND_COVERAGE_FLOOR):
# 60% is the backend floor from map WF-541 decision #542 — it may only rise.
# Only the omit list lives here; the threshold lives in the gate so local
# `pytest -q` runs stay fast and green without coverage overhead.
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scratch/*",
    "scripts/*",
    "corpus/*",
    "evals/*",
    "*/.venv/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
exclude = ["__pycache__", ".venv", ".pytest_cache", "*.ipynb", "scratch", "previous_chats.json"]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
