# Woodpecker CI — PRIMARY pipeline for Vela.
#
# GitHub Actions (ci.yml and friends) act as FALLBACK / secondary gates.
# If any step here fails, the `fallback` step dispatches the GitHub Actions
# ci.yml workflow via its API. Woodpecker stays fully private (polling for
# commits); the only outbound call is to api.github.com.
#
# Required Woodpecker repo secret:
#   github_token  -> GitHub PAT with scopes: repo, actions:write
#
# Triggered by polling (no public webhook needed).

when:
  - event: push
  - event: pull_request

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  backend:
    image: python:3.12-bookworm
    environment:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: vela5012
      GOOGLE_API_KEY: dummy-ci-key
      JWT_SECRET: dummy-ci-jwt-secret
      PYTHONPATH: .
    commands:
      - pip install --quiet uv
      - cd backend && uv sync --frozen && cd ..
      - "[ -f .git/shallow ] && git fetch --unshallow origin || true"
      - git fetch origin main:refs/remotes/origin/main || true
      - python vela_ci.py ci --stack backend --ruff-base "origin/${CI_COMMIT_TARGET_BRANCH:-main}"
      - python vela_ci.py bugs

  client:
    image: node:24-bookworm
    environment:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    commands:
      - corepack enable
      - corepack prepare pnpm@9 --activate
      - cd client && pnpm install --frozen-lockfile && cd ..
      - python3 vela_ci.py ci --stack client
    when:
      - event: push
      - event: pull_request

  corpus:
    image: python:3.12-bookworm
    environment:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: vela5012
      GOOGLE_API_KEY: dummy-ci-key
      JWT_SECRET: dummy-ci-jwt-secret
      PYTHONPATH: .
    commands:
      - pip install --quiet uv
      - cd backend && uv sync --frozen && cd ..
      - python vela_ci.py corpus
    depends_on:
      - backend

  architecture-client:
    image: node:24-bookworm
    environment:
      CI: "true"
    commands:
      - corepack enable
      - corepack prepare pnpm@9 --activate
      - cd client && pnpm install --frozen-lockfile && cd ..
      - cd client && npm run arch:check
    depends_on:
      - client

  architecture-backend:
    image: python:3.12-bookworm
    environment:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: vela5012
      GOOGLE_API_KEY: dummy-ci-key
      JWT_SECRET: dummy-ci-jwt-secret
      PYTHONPATH: .
    commands:
      - pip install --quiet uv
      - cd backend && uv sync --frozen && cd ..
      - cd backend && uv run pytest tests/test_architecture_boundaries.py -q
    depends_on:
      - backend

  ui-e2e:
    image: node:24-bookworm
    environment:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    commands:
      - corepack enable
      - corepack prepare pnpm@9 --activate
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - cd backend && uv sync --frozen && cd ..
      - cd client && pnpm install --frozen-lockfile && cd ..
      - cd client && npx playwright install --with-deps chromium
      - python3 vela_ci.py e2e
    depends_on:
      - backend
      - client

  e2e-dry-run:
    image: python:3.12-bookworm
    commands:
      - bash client/e2e/runner.sh --dry-run
    depends_on:
      - client

  fallback:
    image: curlimages/curl:8.10.1
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      - status: failure
    depends_on:
      - backend
      - client
      - corpus
      - architecture-client
      - architecture-backend
      - ui-e2e
      - e2e-dry-run
    commands:
      - |
        echo "Woodpecker build failed; dispatching GitHub Actions fallback..."
        curl -sS -X POST \
          -H "Authorization: Bearer $${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/parth5012/Vela/actions/workflows/ci.yml/dispatches" \
          -d "{\"ref\":\"${CI_COMMIT_BRANCH}\"}"
