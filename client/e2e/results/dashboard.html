<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vela E2E Verification Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222633;
    --border: #2a2e3d;
    --text: #e4e4e7;
    --text-muted: #9ca3af;
    --pass: #22c55e;
    --pass-bg: rgba(34,197,94,0.12);
    --fail: #ef4444;
    --fail-bg: rgba(239,68,68,0.12);
    --warn: #f59e0b;
    --warn-bg: rgba(245,158,11,0.12);
    --info: #6366f1;
    --info-bg: rgba(99,102,241,0.12);
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); }
  h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
  .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
  .grid { display: grid; gap: 16px; margin-bottom: 32px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .card-value { font-size: 1.8rem; font-weight: 700; }
  .card-value.pass { color: var(--pass); }
  .card-value.fail { color: var(--fail); }
  .card-value.warn { color: var(--warn); }
  .card-value.info { color: var(--info); }
  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
  }
  .status-badge.pass { background: var(--pass-bg); color: var(--pass); }
  .status-badge.fail { background: var(--fail-bg); color: var(--fail); }
  .status-badge.warn { background: var(--warn-bg); color: var(--warn); }
  .status-badge.blocking { background: var(--fail-bg); color: var(--fail); }
  .status-badge.non-blocking { background: var(--info-bg); color: var(--info); }
  .lane-card { margin-bottom: 16px; }
  .lane-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .lane-header h3 { margin: 0; }
  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .feature-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .feature-row:hover { background: var(--surface-hover); }
  .feature-name { font-size: 0.85rem; font-weight: 500; }
  .feature-meta { font-size: 0.75rem; color: var(--text-muted); }
  .feature-detail {
    display: none;
    grid-column: 1 / -1;
    padding: 12px;
    background: var(--bg);
    border-radius: 6px;
    margin-top: -4px;
    margin-bottom: 4px;
    font-size: 0.8rem;
  }
  .feature-detail.open { display: block; }
  .feature-detail pre {
    background: var(--surface);
    padding: 8px;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .trend-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .trend-label { width: 140px; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trend-track {
    flex: 1;
    height: 8px;
    background: var(--surface);
    border-radius: 4px;
    overflow: hidden;
  }
  .trend-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s;
  }
  .trend-fill.high { background: var(--pass); }
  .trend-fill.mid { background: var(--warn); }
  .trend-fill.low { background: var(--fail); }
  .trend-pct { width: 40px; font-size: 0.75rem; text-align: right; color: var(--text-muted); }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state h2 { color: var(--text); margin-bottom: 8px; }
  #error-state { display: none; }
  #dashboard { display: none; }
  @media (max-width: 768px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr; }
    .feature-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="error-state" class="empty-state">
  <h2>No results found</h2>
  <p>Place this file next to a <code>summary.json</code> generated by <code>runner.sh</code>.</p>
  <p style="margin-top:12px; font-size:0.85rem;">
    Expected path: <code>client/e2e/results/&lt;timestamp&gt;/index.html</code>
  </p>
</div>

<div id="dashboard">
  <h1>Vela E2E Verification</h1>
  <div class="subtitle" id="run-meta"></div>

  <!-- Run Summary -->
  <div class="grid grid-4" id="summary-cards"></div>

  <!-- Lane Breakdown -->
  <h2>Lane Breakdown</h2>
  <div id="lane-cards"></div>

  <!-- Flakiness Trend -->
  <h2>Flakiness Trend</h2>
  <div class="card" id="trend-section"></div>
</div>

<script>
(async function () {
  const el = (id) => document.getElementById(id);

  let data;
  try {
    const resp = await fetch('summary.json');
    if (!resp.ok) throw new Error(resp.status);
    data = await resp.json();
  } catch {
    el('error-state').style.display = 'block';
    return;
  }

  el('dashboard').style.display = 'block';

  // Meta
  const ts = new Date(data.timestamp).toLocaleString();
  el('run-meta').textContent = `${ts} \u00b7 ${data.device} \u00b7 ${data.duration_seconds}s`;

  // Summary cards
  const s = data.summary || {};
  const total = s.total || 0;
  const passed = s.passed || 0;
  const failed = s.failed || 0;
  const skipped = s.skipped || 0;
  el('summary-cards').innerHTML = `
    <div class="card"><div class="card-label">Total</div><div class="card-value info">${total}</div></div>
    <div class="card"><div class="card-label">Passed</div><div class="card-value pass">${passed}</div></div>
    <div class="card"><div class="card-label">Failed</div><div class="card-value fail">${failed}</div></div>
    <div class="card"><div class="card-label">Skipped</div><div class="card-value warn">${skipped}</div></div>
  `;

  // Lane breakdown
  const laneMeta = {
    'critical-path':    { label: 'Critical Path', blocking: true },
    'extended-coverage':{ label: 'Extended Coverage', blocking: false },
    'parallel-surface': { label: 'Parallel Surface', blocking: false }
  };
  let laneHtml = '';
  for (const [laneId, lane] of Object.entries(data.lanes || {})) {
    const meta = laneMeta[laneId] || { label: laneId, blocking: false };
    const laneStatus = lane.status || 'UNKNOWN';
    const badge = laneStatus === 'PASS' ? 'pass' : 'fail';
    const blockLabel = meta.blocking ? 'blocking' : 'non-blocking';
    laneHtml += `<div class="card lane-card">
      <div class="lane-header">
        <h3>${meta.label}</h3>
        <span class="status-badge ${badge}">${laneStatus}</span>
        <span class="status-badge ${blockLabel}">${blockLabel}</span>
      </div>
      <div class="feature-grid">`;

    const features = lane.features || {};
    for (const [featId, feat] of Object.entries(features)) {
      const fBadge = feat.status === 'PASS' ? 'pass' : 'fail';
      const attemptText = feat.attempts ? ` (${feat.attempts}/3)` : '';
      const durText = feat.duration_ms ? `${(feat.duration_ms/1000).toFixed(1)}s` : '';
      const detailId = `detail-${laneId}-${featId}`;
      laneHtml += `
        <div class="feature-row" onclick="document.getElementById('${detailId}').classList.toggle('open')">
          <span class="feature-name">${featId}</span>
          <span>
            <span class="status-badge ${fBadge}">${feat.status}${attemptText}</span>
            <span class="feature-meta" style="margin-left:6px">${durText}</span>
          </span>
        </div>
        <div class="feature-detail" id="${detailId}">
          ${feat.screenshot ? `<div>Screenshot: <a href="${feat.screenshot}" style="color:var(--info)">${feat.screenshot}</a></div>` : ''}
          ${feat.logcat ? `<pre>${feat.logcat}</pre>` : '<div style="color:var(--text-muted)">No errors in logcat</div>'}
        </div>`;
    }
    laneHtml += '</div></div>';
  }
  el('lane-cards').innerHTML = laneHtml;

  // Flakiness trend
  const trend = data.flakiness_trend || {};
  const entries = Object.entries(trend);
  if (entries.length === 0) {
    el('trend-section').innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem">No trend data yet. Run the harness multiple times to populate.</div>';
  } else {
    let trendHtml = '';
    for (const [featId, rate] of entries) {
      const pct = Math.round(rate * 100);
      const cls = pct >= 90 ? 'high' : pct >= 70 ? 'mid' : 'low';
      trendHtml += `<div class="trend-bar">
        <span class="trend-label">${featId}</span>
        <div class="trend-track"><div class="trend-fill ${cls}" style="width:${pct}%"></div></div>
        <span class="trend-pct">${pct}%</span>
      </div>`;
    }
    el('trend-section').innerHTML = trendHtml;
  }
})();
</script>
</body>
</html>
