name: Golden Dataset Nightly Eval

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      judge_model:
        description: 'OpenRouter model identifier for judge'
        required: false
        default: 'meta-llama/llama-3.3-70b-instruct'

permissions:
  contents: read

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: ${{ secrets.VELA_API_KEY || 'vela-eval-key' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Golden Dataset Eval Suite with Judge
        run: |
          uv run pytest tests/test_golden.py -v --durations=10
