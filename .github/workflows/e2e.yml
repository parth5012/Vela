name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Validate coverage manifest
        working-directory: client
        run: npm run e2e:coverage
      - name: Gate — Playwright UI e2e (real app, scripted LLM)
        run: python vela_ci.py e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            client/test-results/
            client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Advisory — Playwright Visual Baselines
        id: visual_step
        working-directory: client
        run: npm run e2e:visual
        continue-on-error: true
      - name: Upload visual diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            client/test-results/
            client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
