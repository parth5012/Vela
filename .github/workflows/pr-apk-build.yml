# PR-flag Android APK build — via EAS cloud (eas-cli).
#
# Trigger: add the `build-apk` label to a PR (or push new commits while the
# label is present) → CI submits an EAS cloud build (profile `preview`,
# non-production `com.parth5012.client.dev` APK), waits for it, downloads the
# artifact, and publishes it to a rolling pre-release tag `pr-<number>-apk`,
# linked from a sticky PR comment.
#
# Requires repo secret EXPO_TOKEN (Expo access token). The EAS CLI evaluates
# app.config.js and its plugins locally before upload, so project deps must be
# installed on the runner; compilation itself happens entirely in EAS cloud.
# Note: withAbiSplits makes EAS deliver a .tar.gz containing per-ABI APKs.

name: PR APK build

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write       # create the rolling pre-release + assets
  issues: write         # upsert the sticky comment via the issue-comment API
  pull-requests: write  # read PR labels / metadata

concurrency:
  group: pr-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # github.event_name is 'pull_request' for both activity types below;
    # the activity type itself is github.event.action.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'build-apk') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'build-apk'))
    defaults:
      run:
        working-directory: client
    env:
      CI: 'true'            # suppresses eas-cli upgrade notices on stdout (would corrupt --json)
      EXPO_NO_TELEMETRY: '1'
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TAG: pr-${{ github.event.pull_request.number }}-apk

    steps:
      # Build the PR head commit itself (not the ephemeral merge ref) so the
      # APK matches the sha the rolling release is tagged with.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # eas-cli evaluates app.config.js + config plugins (expo-router,
      # withAbiSplits, ...) locally before uploading sources.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Submit EAS cloud build
        id: submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repo secret is missing — create an Expo access token (expo.dev → Account Settings → Access Tokens) and add it: gh secret set EXPO_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          out=$(eas build --platform android --profile preview --non-interactive --no-wait --json)
          id=$(echo "$out" | jq -r '.[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::eas build did not return a build id"
            echo "$out"
            exit 1
          fi
          echo "Submitted EAS build $id"
          echo "build_id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for EAS build
        id: poll
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          build_id="${{ steps.submit.outputs.build_id }}"
          # EAS queue + native build: poll up to ~60 min.
          for i in $(seq 1 120); do
            # build:view accepts only --json (verified against eas-cli 24.x help)
            json=$(eas build:view "$build_id" --json)
            st=$(echo "$json" | jq -r '.status')
            echo "[$i] $st"
            case "$st" in
              FINISHED)
                url=$(echo "$json" | jq -r '.artifacts.buildUrl // empty')
                if [ -z "$url" ]; then
                  echo "::error::Build finished but artifacts.buildUrl is empty"
                  exit 1
                fi
                echo "build_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ERRORED|CANCELED|PENDING_CANCEL)
                echo "::error::EAS build $build_id ended as $st"
                echo "$json" | jq '.error'
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Timed out after 60 min waiting for EAS build $build_id"
          exit 1

      # EAS delivers a .tar.gz here (withAbiSplits → multiple per-ABI APKs).
      - name: Download and unpack APKs
        run: |
          curl -fSL -o "$RUNNER_TEMP/eas-build.tar.gz" "${{ steps.poll.outputs.build_url }}"
          mkdir -p "$RUNNER_TEMP/apk-src" "$RUNNER_TEMP/apk"
          tar -xzf "$RUNNER_TEMP/eas-build.tar.gz" -C "$RUNNER_TEMP/apk-src"
          sha7=${HEAD_SHA:0:7}
          found=0
          while IFS= read -r apk; do
            base=$(basename "$apk")
            cp "$apk" "$RUNNER_TEMP/apk/vela-pr${PR_NUMBER}-${sha7}-${base}"
            found=1
          done < <(find "$RUNNER_TEMP/apk-src" -name '*.apk' | sort)
          ls -la "$RUNNER_TEMP/apk"
          if [ "$found" -ne 1 ]; then
            echo "::error::No .apk found inside the EAS artifact tarball"
            tar -tzf "$RUNNER_TEMP/eas-build.tar.gz" | head -50
            exit 1
          fi

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace last build for this PR: rolling tag keeps the Releases page
          # (and the PR comment link) stable and lightweight.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || {
            # Older gh without --cleanup-tag (or release already gone):
            # delete the release if present, then the tag if present.
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          }

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "Non-production test build for PR #$PR_NUMBER (EAS \`preview\` profile)."
            echo
            echo "- Commit: \`$HEAD_SHA\`"
            echo "- Variant: preview (\`com.parth5012.client.dev\`), self-signed"
            echo "- EAS build: \`${{ steps.submit.outputs.build_id }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$notes_file"

          gh release create "$TAG" "$RUNNER_TEMP"/apk/*.apk \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "PR #$PR_NUMBER test build (${HEAD_SHA:0:7})" \
            --notes-file "$notes_file"

          # Download links for the sticky comment (asset names are URL-safe).
          links_file="$RUNNER_TEMP/download-links.md"
          : > "$links_file"
          for apk in "$RUNNER_TEMP"/apk/*.apk; do
            name=$(basename "$apk")
            echo "- [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name)" >> "$links_file"
          done

      - name: Upsert sticky PR comment with download links
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- pr-apk-build -->"
        run: |
          body_file="$RUNNER_TEMP/comment.md"
          {
            echo "$MARKER"
            echo "## 📲 Test build ready"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${HEAD_SHA:0:7}\` |"
            echo "| EAS build | \`${{ steps.submit.outputs.build_id }}\` |"
            echo "| Build | [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo
            echo "**Downloads** (direct links — open on your phone, install the arm64 one):"
            echo
            cat "$RUNNER_TEMP/download-links.md"
            echo
            echo "<sub>Rolling release \`$TAG\` — each new build replaces the previous APK."
            echo "Re-trigger: push new commits (label stays on) or remove and re-add the \`build-apk\` label.</sub>"
          } > "$body_file"

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --jq "[.[] | select(.body | contains(\"$MARKER\")) | .id] | first // empty" \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@"$body_file" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@"$body_file" > /dev/null
          fi
