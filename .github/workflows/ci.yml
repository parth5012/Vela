name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: vela5012
      GOOGLE_API_KEY: dummy-ci-key
      JWT_SECRET: dummy-ci-jwt-secret
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uvx ruff check .
        continue-on-error: true
      - name: Ruff format check
        run: uvx ruff format --check .
        continue-on-error: true
      - name: Run pytest
        run: uv run pytest -v

  client-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run Jest
        run: pnpm exec jest --ci --maxWorkers=2

  e2e-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: E2E dry run
        run: bash client/e2e/runner.sh --dry-run
