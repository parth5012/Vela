name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job calls the same entry point agents run locally:
#
#     python vela_ci.py <stack>
#
# so "green in CI" and "green on my machine" cannot drift. The gate owns the
# step list, the env, the log capture and the compact failure summary; this
# workflow only provisions toolchains and calls it.
jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: vela5012
      GOOGLE_API_KEY: dummy-ci-key
      JWT_SECRET: dummy-ci-jwt-secret
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          # The ruff step lints only the lines this branch touched, which needs
          # the base branch history to diff against.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Gate — backend (pytest + ruff on changed lines)
        working-directory: .
        run: python vela_ci.py ci --stack backend --ruff-base "origin/${{ github.base_ref || 'main' }}"
      - name: Gate — bug registry (BUGS.toml)
        working-directory: .
        run: python vela_ci.py bugs

  client-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate — client (eslint + tsc + jest)
        working-directory: .
        run: python vela_ci.py ci --stack client

  corpus-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///test_vela_backend.db
      VELA_API_KEY: vela5012
      GOOGLE_API_KEY: dummy-ci-key
      JWT_SECRET: dummy-ci-jwt-secret
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Gate — pinned corpus + pass floors
        working-directory: .
        run: python vela_ci.py corpus

  ui-e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Gate — Playwright UI e2e (real app, scripted LLM)
        run: python vela_ci.py e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            client/test-results/
            client/playwright-report/
          retention-days: 7

  e2e-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: E2E dry run
        run: bash client/e2e/runner.sh --dry-run
