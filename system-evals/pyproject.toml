[project]
name = "vela-system-evals"
version = "0.1.0"
description = "Vela System-Level Evaluation Pipelines"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=2.1.0",
    "ragas>=0.2.0",
    "langsmith>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["..", "."]
asyncio_mode = "auto"
testpaths = ["."]
