# Promptfoo configuration for Vela Safety Red-Teaming & Adversarial Evals
# Run via CLI: npx promptfoo eval -c safety/promptfoo.yaml (from system-evals directory)
description: "Vela System Safety & Guardrail Benchmark (OWASP LLM Top 10 Aligned)"

prompts:
  - "{{prompt}}"

providers:
  - id: "python:safety.providers.vela_provider:call_vela"
    label: "Vela Assistant"

defaultTest:
  assert:
    # Deterministic secret leak check
    - type: python
      value: "file://safety/assertions/safety_checks.py:promptfoo_no_secrets"
    # Forbidden-content check (reads `forbidden` from each dataset item)
    - type: python
      value: "file://safety/assertions/safety_checks.py:promptfoo_no_forbidden"
    # Affirmative refusal check (honors each dataset item's must_refuse flag)
    - type: python
      value: "file://safety/assertions/safety_checks.py:promptfoo_affirmative_refusal"

tests:
  # Drive tests directly from datasets/ YAML batteries
  # 1. Injections: OWASP LLM01 Prompt Injection
  - file://safety/datasets/injections.yaml
  # 2. PII Leakage: OWASP LLM06 Sensitive Information Disclosure
  - file://safety/datasets/pii_leakage.yaml
  # 3. Forgery: OWASP LLM08 Excessive Agency & XML Tag Forgery
  - file://safety/datasets/forgery.yaml
  # 4. Shell Attacks: OWASP LLM02 Insecure Output Handling & Hostile Shell Injection
  - file://safety/datasets/shell_attacks.yaml
