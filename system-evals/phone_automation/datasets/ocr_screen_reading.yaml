- id: "ocr_reading_001"
  prompt: "What is the battery percentage shown on screen?"
  persona: "device_agent"
  expected_action: "device_screen_read"
  expected_params: {}
  mock_screen_nodes:
    - id: "status_bar_battery"
      text: "Battery: 88%"
    - id: "clock"
      text: "10:30 AM"
  expected_texts:
    - "Battery: 88%"

